<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duo Evolution Tracker</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
<h1>💖 Duo Evolution Tracker 💖</h1>

<div class="card">
<h2>🏋️ Treinos</h2>
<p>Treinos juntos: <span id="treinos">0</span></p>
<p>🔥 Streak: <span id="streak">0</span></p>
<button onclick="registrarTreino()">Registrar Treino</button>
</div>

<div class="grid">
<div class="card">
<h2>🍑 Vitória</h2>
<label>Peso</label><input id="pesoV" type="number" step="0.1">
<label>Glúteo (cm)</label><input id="gluteoV" type="number" step="0.1">
<p>XP: <span id="xpV"></span></p>
<p>Nível: <span id="nivelV"></span></p>
<p id="tituloV"></p>
</div>

<div class="card">
<h2>💪 Rob</h2>
<label>Peso</label><input id="pesoR" type="number" step="0.1">
<p>XP: <span id="xpR"></span></p>
<p>Nível: <span id="nivelR"></span></p>
<p id="tituloR"></p>
</div>
</div>

<div class="card">
<h2>💕 XP do Casal</h2>
<div class="progress"><div class="bar" id="barCasal"></div></div>
<p id="nivelCasal"></p>
</div>

<div class="card">
<h2>🏆 Conquistas</h2>
<div id="conquistas"></div>
</div>

<div class="card">
<h2>📝 Diário</h2>
<textarea id="diario" rows="6"></textarea><br><br>
<button onclick="salvarTudo()">Salvar Diário e Dados</button>
</div>

<div class="card">
<h2>✨ Frase do Dia</h2>
<p id="frase"></p>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
